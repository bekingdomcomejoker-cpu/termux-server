<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termux Files</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: #0d1117; color: #c9d1d9; line-height: 1.6;
  }
  header {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { color: #58a6ff; font-size: 1.2rem; }
  .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }
  .breadcrumb { color: #8b949e; font-size: 0.85rem; margin-bottom: 1rem; }
  .breadcrumb a { color: #58a6ff; text-decoration: none; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.6rem 0.5rem; border-bottom: 1px solid #21262d; font-size: 0.9rem; }
  th { color: #8b949e; font-weight: 500; }
  tr:hover { background: #161b22; }
  .icon { margin-right: 0.5rem; }
  .btn {
    padding: 0.4rem 0.8rem; background: #1f6feb; color: #fff; border: none;
    border-radius: 4px; cursor: pointer; font-size: 0.8rem; margin-right: 0.3rem;
  }
  .btn:hover { background: #388bfd; }
  .btn-danger { background: #da3633; }
  .btn-danger:hover { background: #f85149; }
  .btn-secondary { background: #21262d; border: 1px solid #30363d; }
  .editor {
    width: 100%; min-height: 400px; background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; padding: 1rem; font-family: monospace; font-size: 0.9rem;
    border-radius: 6px; resize: vertical;
  }
  .actions-bar { margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .hidden { display: none; }
  #owner-only { opacity: 0.5; pointer-events: none; }
  #owner-only.active { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<header>
  <h1>📁 Termux File Manager</h1>
  <a class="btn btn-secondary" href="/">← Dashboard</a>
</header>
<div class="container">
  <div class="breadcrumb" id="breadcrumb">/ <a onclick="navigate('')">home</a></div>
  <div class="actions-bar">
    <button class="btn" onclick="showEditor()">+ New File</button>
    <button class="btn btn-secondary" onclick="document.getElementById('upload').click()">📤 Upload</button>
    <input type="file" id="upload" class="hidden" onchange="uploadFile(this)">
  </div>
  <table id="file-table">
    <thead><tr><th>Name</th><th>Size</th><th>Modified</th><th>Actions</th></tr></thead>
    <tbody></tbody>
  </table>

  <div id="editor-panel" class="hidden" style="margin-top:1.5rem">
    <input type="text" id="edit-path" placeholder="filename" style="width:100%;padding:0.5rem;margin-bottom:0.5rem;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;border-radius:4px">
    <textarea id="editor" class="editor" placeholder="File contents..."></textarea>
    <div class="actions-bar" id="owner-only">
      <button class="btn" onclick="saveFile()">💾 Save</button>
      <button class="btn btn-danger" onclick="deleteFile()">🗑 Delete</button>
      <button class="btn btn-secondary" onclick="hideEditor()">Cancel</button>
    </div>
  </div>
</div>

<script>
let currentPath = "";
let isOwner = false;

function getCookie(name) {
  const m = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return m ? m[2] : "";
}

async function checkOwner() {
  isOwner = !!getCookie("ghost");
  if (isOwner) {
    document.getElementById("owner-only").classList.add("active");
  }
}

async function loadFiles(path = "") {
  currentPath = path;
  const r = await fetch(`/file/list?path=${encodeURIComponent(path)}`);
  const d = await r.json();
  const tbody = document.querySelector("#file-table tbody");
  tbody.innerHTML = "";

  if (path) {
    const parent = path.split("/").slice(0, -1).join("/");
    tbody.innerHTML += `<tr><td colspan="4"><a onclick="navigate('${parent}')" style="cursor:pointer;color:#58a6ff">📁 ..</a></td></tr>`;
  }

  d.items.forEach(item => {
    const icon = item.is_dir ? "📁" : "📄";
    const size = item.size !== null ? item.size + " B" : "—";
    const date = item.mtime ? new Date(item.mtime * 1000).toLocaleString() : "—";
    const row = document.createElement("tr");
    row.innerHTML = `
      <td><span class="icon">${icon}</span><a onclick="${item.is_dir ? `navigate('${(path ? path + "/" : "") + item.name}')` : `openFile('${(path ? path + "/" : "") + item.name}')`}" style="cursor:pointer;color:#c9d1d9;text-decoration:none">${item.name}</a></td>
      <td>${size}</td>
      <td>${date}</td>
      <td>
        ${!item.is_dir ? `<button class="btn" onclick="openFile('${(path ? path + "/" : "") + item.name}')">Edit</button>` : ""}
      </td>
    `;
    tbody.appendChild(row);
  });

  document.getElementById("breadcrumb").innerHTML = "/ <a onclick=\"navigate('')\">home</a>" +
    (path ? " / " + path.split("/").map((p,i,a) => `<a onclick="navigate('${a.slice(0,i+1).join('/')}')">${p}</a>`).join(" / ") : "");
}

function navigate(path) {
  loadFiles(path);
}

async function openFile(path) {
  const r = await fetch("/file/read", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path})
  });
  const d = await r.json();
  if (d.error) { alert(d.error); return; }
  document.getElementById("edit-path").value = path;
  document.getElementById("editor").value = d.content;
  document.getElementById("editor-panel").classList.remove("hidden");
  window.scrollTo(0, document.body.scrollHeight);
}

function showEditor() {
  document.getElementById("edit-path").value = currentPath ? currentPath + "/" : "";
  document.getElementById("editor").value = "";
  document.getElementById("editor-panel").classList.remove("hidden");
}

function hideEditor() {
  document.getElementById("editor-panel").classList.add("hidden");
}

async function saveFile() {
  const path = document.getElementById("edit-path").value;
  const content = document.getElementById("editor").value;
  const r = await fetch("/file/write", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path, content})
  });
  const d = await r.json();
  if (d.status === "ok") {
    alert("Saved!");
    loadFiles(currentPath);
    hideEditor();
  } else {
    alert(d.error || "Save failed");
  }
}

async function deleteFile() {
  const path = document.getElementById("edit-path").value;
  if (!confirm("Delete " + path + "?")) return;
  const r = await fetch("/file/delete", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({path})
  });
  const d = await r.json();
  if (d.status === "deleted") {
    loadFiles(currentPath);
    hideEditor();
  } else {
    alert(d.error || "Delete failed");
  }
}

function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    const path = (currentPath ? currentPath + "/" : "") + file.name;
    const r = await fetch("/file/write", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({path, content: e.target.result})
    });
    const d = await r.json();
    if (d.status === "ok") loadFiles(currentPath);
    else alert(d.error || "Upload failed");
  };
  reader.readAsText(file);
}

checkOwner();
loadFiles();
</script>
</body>
</html>
