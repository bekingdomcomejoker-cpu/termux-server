<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👻 Ghost Worker — Termux Pool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: #0d1117; color: #c9d1d9; line-height: 1.6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 2rem; max-width: 600px; width: 100%; text-align: center;
  }
  h1 { color: #58a6ff; margin-bottom: 0.5rem; }
  .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .status {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 1rem;
  }
  .status-idle { background: #21262d; color: #8b949e; }
  .status-active { background: #23863633; color: #3fb950; border: 1px solid #238636; }
  .status-busy { background: #9e6a0333; color: #d29922; border: 1px solid #9e6a03; }
  .status-error { background: #f8514933; color: #f85149; border: 1px solid #f85149; }
  .log {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 1rem; font-family: monospace; font-size: 0.8rem;
    height: 250px; overflow-y: auto; text-align: left; color: #a5d6ff;
    margin-top: 1rem;
  }
  .log .err { color: #f85149; }
  .log .ok { color: #3fb950; }
  .log .warn { color: #d29922; }
  .btn {
    padding: 0.6rem 1.2rem; background: #1f6feb; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin: 0.3rem;
  }
  .btn:hover { background: #388bfd; }
  .btn-secondary { background: #21262d; border: 1px solid #30363d; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
  .stat-box { background: #0d1117; border-radius: 6px; padding: 0.75rem; }
  .stat-box .num { font-size: 1.5rem; font-weight: 700; color: #3fb950; }
  .stat-box .label { font-size: 0.75rem; color: #8b949e; }
</style>
</head>
<body>
<div class="card">
  <h1>👻 Ghost Worker</h1>
  <p class="subtitle">Pool presence node — does NOT process inference jobs</p>

  <div class="status status-idle" id="status-badge">
    <span id="status-dot">○</span> <span id="status-text">Idle — click Start</span>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="num" id="jobs-seen">0</div>
      <div class="label">Jobs Seen</div>
    </div>
    <div class="stat-box">
      <div class="num" id="pongs-sent">0</div>
      <div class="label">Keepalives</div>
    </div>
  </div>

  <div>
    <button class="btn" id="btn-start" onclick="startWorker()">▶ Start Ghost</button>
    <button class="btn btn-secondary" id="btn-stop" onclick="stopWorker()" disabled>⏹ Stop</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
let running = false;
let ws = null;
let reconnectTimer = null;
let keepaliveTimer = null;
let reconnectDelay = 1000;
let jobsSeen = 0;
let pongsSent = 0;

function log(msg, type="info") {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.className = type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

function setStatus(cls, dot, text) {
  const badge = document.getElementById("status-badge");
  badge.className = "status status-" + cls;
  document.getElementById("status-dot").textContent = dot;
  document.getElementById("status-text").textContent = text;
}

function startWorker() {
  if (running) return;
  running = true;
  clearTimeout(reconnectTimer);
  document.getElementById("btn-start").disabled = true;
  document.getElementById("btn-stop").disabled = false;
  setStatus("active", "●", "Connecting...");

  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = protocol + "//" + window.location.host + "/ws/worker";

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    reconnectDelay = 1000;
    log("Connected to coordinator", "ok");
    setStatus("active", "●", "Active — presence only");
    // NOTE: No "default" in models — we do NOT process inference jobs
    ws.send(JSON.stringify({
      type: "register",
      worker_id: "ghost-browser-" + Math.random().toString(36).slice(2, 8),
      capabilities: {
        models: ["ghost-wasm"],  // NO "default" — won't steal inference jobs
        max_concurrent: 0,
        supports_streaming: false,
        backend: "browser_presence",
        type: "ghost_worker"
      },
      hardware: {
        platform: "browser",
        cores: navigator.hardwareConcurrency || 1,
        ram: navigator.deviceMemory || "unknown"
      }
    }));

    keepaliveTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: "pong", worker_id: "ghost", timestamp: Date.now()}));
        pongsSent++;
        document.getElementById("pongs-sent").textContent = pongsSent;
      }
    }, 15000);
  };

  ws.onmessage = async (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "ping") {
        ws.send(JSON.stringify({type: "pong", worker_id: msg.worker_id || "ghost"}));
      } else if (msg.type === "inference_request") {
        // We should never receive these (no "default" model), but reject just in case
        jobsSeen++;
        document.getElementById("jobs-seen").textContent = jobsSeen;
        log(`Job ${msg.job_id}: rejected (ghost worker does not process jobs)`, "warn");
        ws.send(JSON.stringify({
          type: "inference_response",
          job_id: msg.job_id,
          worker_id: "ghost-browser",
          status: "error",
          error: "Ghost worker is presence-only. Use Selenium worker for real inference."
        }));
      } else if (msg.type === "registered") {
        log("Registered as " + msg.worker_id, "ok");
      }
    } catch (err) {
      log("WS handler error: " + err.message, "err");
    }
  };

  ws.onclose = () => {
    clearInterval(keepaliveTimer);
    if (running) {
      log(`Disconnected. Reconnecting in ${reconnectDelay/1000}s...`, "warn");
      setStatus("error", "✕", "Reconnecting...");
      reconnectTimer = setTimeout(startWorker, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 30000);
    }
  };

  ws.onerror = (e) => {
    log("WebSocket error", "err");
  };
}

function stopWorker() {
  running = false;
  clearTimeout(reconnectTimer);
  clearInterval(keepaliveTimer);
  if (ws) {
    ws.onclose = null;
    ws.close();
  }
  document.getElementById("btn-start").disabled = false;
  document.getElementById("btn-stop").disabled = true;
  setStatus("idle", "○", "Idle — click Start");
  log("Ghost worker stopped");
}

if (new URLSearchParams(window.location.search).has("autostart")) {
  startWorker();
}
</script>
</body>
</html>
