<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👻 Ghost Worker — Termux Pool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
    background: #0d1117; color: #c9d1d9; line-height: 1.6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
  }
  .card {
    background: #161b22; border: 1px solid #30363d; border-radius: 12px;
    padding: 2rem; max-width: 600px; width: 100%; text-align: center;
  }
  h1 { color: #58a6ff; margin-bottom: 0.5rem; }
  .subtitle { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .status {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.5rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
    margin-bottom: 1rem;
  }
  .status-idle { background: #21262d; color: #8b949e; }
  .status-active { background: #23863633; color: #3fb950; border: 1px solid #238636; }
  .log {
    background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
    padding: 1rem; font-family: monospace; font-size: 0.8rem;
    height: 200px; overflow-y: auto; text-align: left; color: #a5d6ff;
    margin-top: 1rem;
  }
  .log .err { color: #f85149; }
  .log .ok { color: #3fb950; }
  .btn {
    padding: 0.6rem 1.2rem; background: #1f6feb; color: #fff; border: none;
    border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin: 0.3rem;
  }
  .btn:hover { background: #388bfd; }
  .btn-secondary { background: #21262d; border: 1px solid #30363d; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1rem 0; }
  .stat-box { background: #0d1117; border-radius: 6px; padding: 0.75rem; }
  .stat-box .num { font-size: 1.5rem; font-weight: 700; color: #3fb950; }
  .stat-box .label { font-size: 0.75rem; color: #8b949e; }
</style>
</head>
<body>
<div class="card">
  <h1>👻 Ghost Worker</h1>
  <p class="subtitle">Silent browser compute node for the Termux Pool</p>

  <div class="status status-idle" id="status-badge">
    <span id="status-dot">○</span> <span id="status-text">Idle — click Start to donate compute</span>
  </div>

  <div class="stats">
    <div class="stat-box">
      <div class="num" id="jobs-done">0</div>
      <div class="label">Jobs Completed</div>
    </div>
    <div class="stat-box">
      <div class="num" id="tokens-gen">0</div>
      <div class="label">Tokens Generated</div>
    </div>
  </div>

  <div>
    <button class="btn" id="btn-start" onclick="startWorker()">▶ Start Ghost</button>
    <button class="btn btn-secondary" id="btn-stop" onclick="stopWorker()" disabled>⏹ Stop</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
let running = false;
let ws = null;
let jobsDone = 0;
let tokensGen = 0;

function log(msg, type="info") {
  const el = document.getElementById("log");
  const line = document.createElement("div");
  line.className = type;
  line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function startWorker() {
  if (running) return;
  running = true;

  document.getElementById("btn-start").disabled = true;
  document.getElementById("btn-stop").disabled = false;
  document.getElementById("status-badge").className = "status status-active";
  document.getElementById("status-dot").textContent = "●";
  document.getElementById("status-text").textContent = "Active — connected to pool";

  const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
  const wsUrl = protocol + "//" + window.location.host + "/ws/worker";

  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    log("Connected to coordinator", "ok");
    ws.send(JSON.stringify({
      type: "register",
      worker_id: "ghost-browser-" + Math.random().toString(36).slice(2, 8),
      capabilities: {
        models: ["ghost-wasm", "default"],
        max_concurrent: 1,
        supports_streaming: false,
        backend: "browser_wasm",
        type: "ghost_worker"
      },
      hardware: {
        platform: "browser",
        cores: navigator.hardwareConcurrency || 1,
        ram: navigator.deviceMemory || "unknown"
      }
    }));
  };

  ws.onmessage = async (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === "ping") {
        ws.send(JSON.stringify({type: "pong", worker_id: msg.worker_id || "ghost"}));
      } else if (msg.type === "inference_request") {
        await handleJob(msg);
      } else if (msg.type === "registered") {
        log("Registered as " + msg.worker_id, "ok");
      }
    } catch (err) {
      log("WS message error: " + err, "err");
    }
  };

  ws.onclose = () => {
    log("Connection closed", "err");
    if (running) {
      log("Reconnecting in 5s...", "info");
      setTimeout(startWorker, 5000);
    }
  };

  ws.onerror = (e) => {
    log("WebSocket error", "err");
  };
}

async function handleJob(msg) {
  const jobId = msg.job_id;
  const prompt = msg.prompt;
  log(`Job ${jobId}: ${prompt.slice(0, 40)}...`);

  const response = `[Ghost Worker] Simulated response to: "${prompt.slice(0, 100)}"\n\n` +
    `This is a browser-based ghost worker. In production, this would run a WASM LLM ` +
    `(e.g., wllama, llama.cpp wasm) to process the prompt locally and return real inference.`;

  await new Promise(r => setTimeout(r, 2000));

  ws.send(JSON.stringify({
    type: "inference_response",
    job_id: jobId,
    worker_id: "ghost-browser",
    status: "success",
    response: response
  }));

  jobsDone++;
  tokensGen += Math.floor(response.length / 4);
  document.getElementById("jobs-done").textContent = jobsDone;
  document.getElementById("tokens-gen").textContent = tokensGen;
  log(`Job ${jobId}: completed`, "ok");
}

function stopWorker() {
  running = false;
  if (ws) ws.close();
  document.getElementById("btn-start").disabled = false;
  document.getElementById("btn-stop").disabled = true;
  document.getElementById("status-badge").className = "status status-idle";
  document.getElementById("status-dot").textContent = "○";
  document.getElementById("status-text").textContent = "Idle — click Start to donate compute";
  log("Ghost worker stopped");
}

if (new URLSearchParams(window.location.search).has("autostart")) {
  startWorker();
}
</script>
</body>
</html>
