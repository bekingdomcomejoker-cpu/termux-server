<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Termux Terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<style>
  body { margin: 0; background: #0d1117; height: 100vh; display: flex; flex-direction: column; }
  #toolbar {
    background: #161b22; border-bottom: 1px solid #30363d;
    padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center;
    font-family: monospace; font-size: 0.85rem; color: #8b949e;
  }
  #toolbar .mode { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
  .mode-owner { background: #238636; color: #fff; }
  .mode-public { background: #9e6a03; color: #fff; }
  #terminal { flex: 1; padding: 0.5rem; }
</style>
</head>
<body>
<div id="toolbar">
  <span>🖥 Termux Terminal</span>
  <span id="mode-badge" class="mode mode-public">PUBLIC (SANDBOXED)</span>
</div>
<div id="terminal"></div>

<script>
const term = new Terminal({
  fontFamily: "'Courier New', monospace",
  fontSize: 14,
  theme: {
    background: "#0d1117", foreground: "#c9d1d9",
    cursor: "#58a6ff", selectionBackground: "#264f78"
  },
  cursorBlink: true,
  scrollback: 10000
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById("terminal"));
fitAddon.fit();

const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
const wsUrl = protocol + "//" + window.location.host + "/ws/terminal";
const ws = new WebSocket(wsUrl);

let owner = false;
let buffer = "";

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : "";
}

ws.onopen = () => {
  const token = getCookie("ghost");
  ws.send(JSON.stringify({token: token}));
};

ws.onmessage = (e) => {
  const data = e.data;
  if (data.includes("root@") || data.includes("bash-")) {
    owner = true;
    document.getElementById("mode-badge").textContent = "OWNER (ROOT)";
    document.getElementById("mode-badge").className = "mode mode-owner";
  }
  term.write(data);
};

ws.onclose = () => {
  term.write("\r\n\x1b[31m[Connection closed]\x1b[0m\r\n");
};

term.onData((data) => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(data);
  }
});

window.addEventListener("resize", () => fitAddon.fit());
</script>
</body>
</html>
